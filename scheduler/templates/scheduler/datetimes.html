{% extends "scheduler/base.html" %}

{% block content %}

<h2>Date Records</h2>

<a href="{% url 'home' %}" class="btn btn-secondary mb-3">
    Home
</a>

<table class="table table-bordered table-striped">

    <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Date & Time</th>
            <th>Time Zone</th>

        </tr>

    </thead>

    <tbody>

    {% for record in records %}

        <tr>

            <td>{{ record.id }}</td>
            <td>{{ record.datetime_value }}</td>
            <td>{{ record.timezone }}</td>

        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
